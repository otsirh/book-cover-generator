name: Idea or new style
description: Suggest a style, palette, option or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: For a new style, describe it or link to covers that inspire it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
