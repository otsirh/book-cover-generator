name: Release

# A version tag (v1.7.0) publishes that version to npm, with provenance, and makes its GitHub
# release from the CHANGELOG. npm trusts this workflow to publish (trusted publishing, set in the
# package's settings on npmjs.com), so no npm token is stored anywhere.
#
# Run it by hand for a dry run: the checks, and what npm would be given. Run it on a released
# tag, naming it, to bring that GitHub release up to date (notes, and the package with its signed
# provenance).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      release:
        description: A released tag (v1.7.0) to bring the GitHub release up to date for (notes, signed package)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that runs the repository's code (its dev tools, tests and the JSR check) runs here,
  # in a job that can't publish anything; it hands on the package it packed.
  verify:
    name: Check and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The tag names the package's version, and the CHANGELOG has its section
        if: github.event_name == 'push'
        run: |
          version="v$(node -p 'require("./package.json").version')"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME, package $version"; exit 1; }
          # (Checked before publishing: a version on npm can't be taken back.)
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "::error::No CHANGELOG section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - run: npm ci
      - run: npm run check
      # JSR takes the package too (checked before npm publishes: a version on npm is for good). The
      # Deno that jsr@0.14.3 runs, with the flags it adds for an npm package.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.6.7
      - name: JSR would take it
        run: deno publish --dry-run $JSR_FLAGS
        env:
          JSR_FLAGS: --unstable-bare-node-builtins --unstable-sloppy-imports --unstable-byonm --no-check
          DENO_DISABLE_PEDANTIC_NODE_WARNINGS: 'true'
      - uses: ./.github/actions/mcp-publisher
      - name: The MCP registry takes server.json
        run: ./mcp-publisher validate server.json && rm mcp-publisher
      - name: The package
        run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: book-cover-generator-*.tgz
          retention-days: 7
          if-no-files-found: error

  # Publishes the package the checks passed, byte for byte, running none of the repository's code.
  # npm trusts this workflow (trusted publishing), so no npm token is kept anywhere.
  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm can publish with trusted publishing (11.5.1 or later)
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`::error::npm ${process.argv[1]} is too old for trusted publishing`); process.exit(1); }
          ' "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Only a pushed tag publishes: a run started by hand is a dry run, even on a tag.
      - name: Publish
        if: github.event_name == 'push'
        run: npm publish ./book-cover-generator-*.tgz
      - name: What would be published
        if: github.event_name != 'push'
        run: npm publish --dry-run ./book-cover-generator-*.tgz

  # JSR (jsr.io/@otsirh/book-cover-generator), for Deno: npm's version, published with the
  # repository's identity (the package on jsr.io is linked to it). On when the repository variable
  # JSR_PUBLISH is 1.
  jsr:
    name: Publish to JSR
    needs: npm
    if: github.event_name == 'push' && vars.JSR_PUBLISH == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.6.7
      - run: deno publish $JSR_FLAGS
        env:
          JSR_FLAGS: --unstable-bare-node-builtins --unstable-sloppy-imports --unstable-byonm --no-check
          DENO_DISABLE_PEDANTIC_NODE_WARNINGS: 'true'

  # The official MCP registry (registry.modelcontextprotocol.io): server.json, as
  # io.github.otsirh/book-cover-generator, which GitHub's identity for this repository proves; the
  # registry checks npm's package names it (mcpName).
  mcp-registry:
    name: Publish to the MCP registry
    needs: npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/mcp-publisher
      # (npm takes a while to show a version it has just taken, and the registry checks that npm has
      # it: 1.13.0's first try was refused with a 404.)
      - name: Wait until npm shows the version
        run: |
          version=$(jq -r .version server.json)
          for _ in $(seq 1 30); do
            [ "$(npm view "book-cover-generator@$version" version 2>/dev/null)" = "$version" ] && exit 0
            sleep 10
          done
          echo "npm doesn't show book-cover-generator@$version after 5 minutes" >&2
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json

  github:
    name: GitHub release
    needs: npm
    if: github.event_name == 'push' || inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: The tag is a version, and a run by hand runs on it
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Not a version tag: $TAG"; exit 1; }
          # (So the signed provenance names the tag. A tag made before 1.8.0 has an older copy of this
          # workflow, which can't bring its release up to date.)
          [ "$GITHUB_REF" = "refs/tags/$TAG" ] || { echo "::error::Run this on the tag $TAG (Use workflow from: $TAG), not $GITHUB_REF"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No CHANGELOG section for ${TAG#v}"; exit 1; }
      # The package as published (the one the checks passed), and its build provenance signed with
      # Sigstore (verify with `gh attestation verify book-cover-generator-X.Y.Z.tgz --repo
      # otsirh/book-cover-generator`).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: book-cover-generator-*.tgz
      - name: Its signed provenance, beside it
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "book-cover-generator-${TAG#v}.tgz.sigstore"
      - name: Make the release (or bring an existing one up to date)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "${TAG#v}" --notes-file notes.md
          else
            # (Only a new release, pushed, is the latest: an old one made by hand isn't.)
            latest=$([ "$GITHUB_EVENT_NAME" = push ] && echo --latest || echo --latest=false)
            gh release create "$TAG" --verify-tag "$latest" --title "${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" "book-cover-generator-${TAG#v}.tgz" "book-cover-generator-${TAG#v}.tgz.sigstore" --clobber
