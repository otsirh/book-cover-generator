name: Release

# A version tag (v1.7.0) publishes that version to npm, with provenance, and makes its GitHub
# release from the CHANGELOG. npm trusts this workflow to publish (trusted publishing, set in the
# package's settings on npmjs.com), so no npm token is stored anywhere.
#
# Run it by hand for a dry run: the checks, and what the package would hold. Run it on a released
# tag, naming it, to bring that GitHub release up to date (notes, and the package with its signed
# provenance).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      release:
        description: A released tag (v1.7.0) to bring the GitHub release up to date for (notes, signed package)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: The tag names the package's version, and the CHANGELOG has its section
        if: github.event_name == 'push'
        run: |
          version="v$(node -p 'require("./package.json").version')"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME, package $version"; exit 1; }
          # (Checked before publishing: a version on npm can't be taken back.)
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "::error::No CHANGELOG section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: npm can publish with trusted publishing (11.5.1 or later)
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`::error::npm ${process.argv[1]} is too old for trusted publishing`); process.exit(1); }
          ' "$(npm --version)"
      - run: npm ci
      - run: npm run check
      # JSR takes the package too (checked before npm publishes: a version on npm is for good).
      - run: npx --yes jsr@0.14.3 publish --dry-run
      # Only a pushed tag publishes: a run started by hand is a dry run, even on a tag.
      - name: Publish
        if: github.event_name == 'push'
        run: npm publish
      - name: What would be published
        if: github.event_name != 'push'
        run: npm pack --dry-run

  # JSR (jsr.io/@otsirh/book-cover-generator), for Deno: npm's version, published with the
  # repository's identity (the package on jsr.io is linked to it). On when the repository variable
  # JSR_PUBLISH is 1.
  jsr:
    name: Publish to JSR
    needs: npm
    if: github.event_name == 'push' && vars.JSR_PUBLISH == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npx --yes jsr@0.14.3 publish

  github:
    name: GitHub release
    needs: npm
    if: github.event_name == 'push' || inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: The tag is a version, and a run by hand runs on it
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Not a version tag: $TAG"; exit 1; }
          # (So the signed provenance names the tag. A tag made before 1.8.0 has an older copy of this
          # workflow, which can't bring its release up to date.)
          [ "$GITHUB_REF" = "refs/tags/$TAG" ] || { echo "::error::Run this on the tag $TAG (Use workflow from: $TAG), not $GITHUB_REF"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No CHANGELOG section for ${TAG#v}"; exit 1; }
      # The package as published, and its build provenance signed with Sigstore (verify with
      # `gh attestation verify book-cover-generator-X.Y.Z.tgz --repo otsirh/book-cover-generator`).
      - name: The package
        run: npm pack
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: book-cover-generator-*.tgz
      - name: Its signed provenance, beside it
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "book-cover-generator-${TAG#v}.tgz.sigstore"
      - name: Make the release (or bring an existing one up to date)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "${TAG#v}" --notes-file notes.md
          else
            # (Only a new release, pushed, is the latest: an old one made by hand isn't.)
            latest=$([ "$GITHUB_EVENT_NAME" = push ] && echo --latest || echo --latest=false)
            gh release create "$TAG" --verify-tag "$latest" --title "${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" "book-cover-generator-${TAG#v}.tgz" "book-cover-generator-${TAG#v}.tgz.sigstore" --clobber
