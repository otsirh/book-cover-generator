name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches an expiring security.txt and breakage from new runner images.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, format, types, package & fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint:package
      # Property-based fuzzing (fast-check, a dev dependency: the unit test jobs install nothing).
      - run: npm run test:fuzz
      # The Worker's copy of resvg's glue is the installed package's (after a Dependabot update, run
      # node scripts/vendor-resvg.js).
      - run: node scripts/vendor-resvg.js --check
      # PNG covers (resvg, a dev dependency, which the bare unit jobs don't install): required here.
      - run: node --test test/png.test.js test/worker.test.js
        env:
          REQUIRE_RESVG: '1'
      # JSR (for Deno) takes the package as it is: fast types too, which its server requires (no
      # global types, for one). The Deno that jsr@0.14.3 runs, with the flags it adds for an npm
      # package (as the release does).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.6.7
      - name: JSR would take it
        run: deno publish --dry-run $JSR_FLAGS
        env:
          JSR_FLAGS: --unstable-bare-node-builtins --unstable-sloppy-imports --unstable-byonm --no-check
          DENO_DISABLE_PEDANTIC_NODE_WARNINGS: 'true'
      # The Worker as Cloudflare would take it: the config, its bindings and the bundle.
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - uses: ./.github/actions/mcp-publisher
      - name: The MCP registry takes server.json
        run: ./mcp-publisher validate server.json
      - run: npm audit --audit-level=moderate

  unit:
    name: Unit tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # The library has no dependencies, so the unit tests run without `npm ci`.
      - run: node --test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run test:coverage

  runtimes:
    name: Node, Deno and Bun draw the same covers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The library has no dependencies, so each runtime runs it as it is.
      - name: The same bytes in every runtime
        run: |
          node=$(node scripts/runtime-check.js)
          deno=$(deno run --allow-read --allow-env scripts/runtime-check.js)
          bun=$(bun scripts/runtime-check.js)
          printf 'node %s\ndeno %s\nbun  %s\n' "$node" "$deno" "$bun"
          [ "$node" = "$deno" ] && [ "$node" = "$bun" ] || { echo "::error::The runtimes drew different covers"; exit 1; }
      # Every module, symbol and member of the public API has docs (JSR's docs pages and score).
      - name: The API is documented
        run: deno doc --lint src/index.js src/browser.js src/element.js

  e2e:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile, browser: chromium }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ci-passed:
    name: CI passed
    if: always()
    needs: [checks, unit, coverage, runtimes, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
